# SPDX-License-Identifier: Apache-2.0
# Verifies a tagged source tree, then publishes the redistributable tunnel image.
name: Release OCI images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify release source and images
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

        with:
          fetch-depth: 0

      - name: Validate the release tag
        shell: bash

        run: |
          set -Eeuo pipefail

          if [[ ! $GITHUB_REF_NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must have the form vX.Y.Z" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check Docker and Compose

        run: |
          docker version
          docker compose version

      - name: Run source and Compose checks
        run: |
          make check-static
          make compose-check

      - name: Build the redistributable tunnel candidate
        run: docker build --tag pku-array-vpn-proxy:release-test .

      - name: Test the tunnel candidate
        env:
          IMAGE: pku-array-vpn-proxy:release-test

        run: |
          tests/test-openconnect-driver.sh
          tests/test-startup-session-rejection.sh

          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = \
            arrayvpn:arrayvpn

  publish:
    name: Publish tunnel image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      IMAGE: ghcr.io/zhengli2004/pku-array-vpn-proxy

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3

        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6

        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true

          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

          cache-from: type=gha,scope=tunnel
          cache-to: type=gha,mode=max,scope=tunnel
          sbom: true
          provenance: mode=max

      - name: Attest the published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4

        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
